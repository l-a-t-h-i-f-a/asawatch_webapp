<head>

<title>Foto Makanan · AsaWatch</title>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo/icon-32.png">
<link rel="apple-touch-icon" href="../assets/logo/icon-180.png">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="nutrisi" data-nav="tengah">
<div id="page-content">
<div class="page-head"><h2 class="title"><a class="back" href="dashboard.html" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>Foto Makanan</h2></div>
<div class="grid-2">
  <div class="card" id="kartuKamera">
    <div class="shot gelap" id="shotBox">
      <video id="camView" autoplay playsinline muted class="hidden"></video>
      <div class="kamera-galat hidden" id="kamGalat"></div>
    </div>
    <button class="rana" id="btnRana" disabled aria-label="Ambil foto"><svg><use href="#i-camera"/></svg></button>
    <p class="muted center" style="margin:.8rem 0 .6rem">Potret piring sebelum makan. Saat rana ditekan, jam langsung mengukur baseline dan tombol "Selesai Makan" di jam menyala.</p>
    <button class="btn-ghost block" id="btnGaleri"><svg class="bi"><use href="#i-image"/></svg> Pilih dari Galeri</button>
    <input type="file" id="filePick" accept="image/*" hidden>
  </div>
  <div class="card hidden" id="kartuDraft"></div>
</div>
</div>
<script src="js/server-config.js"></script>
<script src="js/protokol.js"></script>
<script src="js/model.js"></script>
<script src="js/db.js"></script>

<script src="js/ble.js"></script>
<script src="js/sesi.js"></script>
<script src="js/komponen.js"></script>
<script src="js/kurva.js"></script>
<script src="js/shell.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
