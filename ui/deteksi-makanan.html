<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2fa360">
<title>Deteksi Makanan · AsaWatch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9200;</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body data-page="nutrisi">
<div id="page-content">
<div class="page-head"><h2 class="title"><a class="back" href="dashboard.html" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>Deteksi Makanan</h2></div>

<div class="grid-2">
  <div class="card">
    <div class="shot" id="shotBox">
      <video id="camView" autoplay playsinline muted class="hidden"></video>
      <img id="shotImg" class="hidden" alt="Foto makanan">
      <div id="shotEmpty"><svg><use href="#i-food"/></svg><p>Arahkan kamera ke piring makananmu</p></div>
    </div>
    <div class="row gap">
      <button class="btn-ghost block" id="btnCam"><svg class="bi"><use href="#i-camera"/></svg> Ambil Foto</button>
      <button class="btn-ghost block" id="btnUpload">Upload Gambar</button>
      <input type="file" id="filePick" accept="image/*" hidden>
    </div>
    <small class="muted">Gunakan kamera perangkat atau unggah gambar makanan.</small>
  </div>

  <div class="card">
    <div class="card-head"><h3>Hasil Deteksi</h3><small>Total kalori</small></div>
    <div class="donut-wrap">
      <div class="donut" id="donut"><b id="kalTotal">0<small>kcal</small></b></div>
      <ul class="macro">
        <li><i class="b1"></i><span>Karbohidrat</span><b id="mc">0 g (0%)</b></li>
        <li><i class="b2"></i><span>Protein</span><b id="mp">0 g (0%)</b></li>
        <li><i class="b3"></i><span>Lemak</span><b id="mf">0 g (0%)</b></li>
      </ul>
    </div>

    <div class="nutri-form">
      <label>Kalori (kcal)<input type="number" id="f_kalori" min="0" placeholder="0"></label>
      <label>Karbohidrat (g)<input type="number" id="f_karbo" min="0" placeholder="0"></label>
      <label>Protein (g)<input type="number" id="f_protein" min="0" placeholder="0"></label>
      <label>Lemak (g)<input type="number" id="f_lemak" min="0" placeholder="0"></label>
      <label>Gula (g)<input type="number" id="f_gula" min="0" placeholder="0"></label>
    </div>

    <div class="alert hidden" id="foodAlert">
      <svg><use href="#i-warn"/></svg>
      <div><b>Tinggi Gula</b><p>Kandungan gula di atas 10 g per porsi.</p></div>
    </div>

    <div class="row gap">
      <a class="btn-ghost block" href="riwayat.html">Lihat Riwayat</a>
      <button class="btn-primary block" id="btnSaveFood">Simpan Hasil</button>
    </div>
  </div>
</div>
</div>
<script src="../js/database.js"></script>
<script src="../js/api.js"></script>
<script src="../js/bluetooth.js"></script>
<script src="js/server-config.js"></script>
<script src="js/server.js"></script>
<script src="js/shell.js"></script>
<script src="js/store.js"></script>
<script src="js/device.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
