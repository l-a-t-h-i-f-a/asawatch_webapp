<body data-page="app">
<!-- Aplikasi satu halaman: koneksi Bluetooth ke jam terikat pada dokumen, jadi
     berpindah halaman TIDAK boleh mengganti dokumen. shell.js menyalin template
     di bawah ke #content sesuai rute #/<nama>; pages.js menjalankan controllernya. -->
<template data-rute="dashboard">
<div id="beranda"></div>
</template>

<template data-rute="deteksi-makanan">
<div class="page-head"><h2 class="title"><a class="back" href="dashboard.html" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>Foto Makanan</h2></div>
<div class="grid-2">
  <div class="card" id="kartuKamera">
    <div class="shot gelap" id="shotBox">
      <video id="camView" autoplay playsinline muted class="hidden"></video>
      <div class="kamera-galat hidden" id="kamGalat"></div>
    </div>
    <button class="rana" id="btnRana" disabled aria-label="Ambil foto"><svg><use href="#i-camera"/></svg></button>
    <p class="muted center" style="margin:.8rem 0 .6rem">Potret piring sebelum makan. Saat rana ditekan, jam langsung mengukur baseline dan tombol "Selesai Makan" di jam menyala.</p>
    <button class="btn-ghost block" id="btnGaleri"><svg class="bi"><use href="#i-image"/></svg> Pilih dari Galeri</button>
    <input type="file" id="filePick" accept="image/*" hidden>
  </div>
  <div class="card hidden" id="kartuDraft"></div>
</div>
</template>

<template data-rute="sesi-berjalan">
<div class="page-head"><h2 class="title"><a class="back" href="dashboard.html" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>Sesi Berjalan</h2></div><div id="sesi"></div>
</template>

<template data-rute="ringkasan-sesi">
<div class="page-head"><h2 class="title"><a class="back" href="riwayat.html" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>Ringkasan Sesi</h2></div><div id="ringkasan"></div>
</template>

<template data-rute="riwayat">
<div class="page-head"><h2 class="title">Riwayat Sesi</h2></div>
<div class="pills" style="margin-bottom:1rem">
  <button class="pill active" data-f="semua">Semua</button>
  <button class="pill" data-f="sarapan">Sarapan</button>
  <button class="pill" data-f="makanSiang">Makan Siang</button>
  <button class="pill" data-f="makanMalam">Makan Malam</button>
  <button class="pill" data-f="camilan">Camilan</button>
  <button class="pill" data-f="landai">Landai</button>
  <button class="pill" data-f="sedang">Sedang</button>
  <button class="pill" data-f="lonjakan">Lonjakan</button>
</div>
<div class="card"><div id="daftarRiwayat"></div></div>
</template>

<template data-rute="analisis">
<div class="page-head"><h2 class="title">Analisis</h2></div><div id="analisis"></div>
</template>

<template data-rute="gula-darah">
<div class="page-head"><h2 class="title"><a class="back" href="analisis.html" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>Gula Darah</h2></div><div id="metrik"></div>
</template>

<template data-rute="detak-jantung">
<div class="page-head"><h2 class="title"><a class="back" href="analisis.html" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>Detak Jantung</h2></div><div id="metrik"></div>
</template>

<template data-rute="tensi">
<div class="page-head"><h2 class="title"><a class="back" href="analisis.html" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>Tekanan Darah</h2></div><div id="metrik"></div>
</template>

<template data-rute="pindai-kesehatan">
<div class="page-head"><h2 class="title"><a class="back" href="dashboard.html" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>Pindai Kesehatan</h2></div><div id="pindai"></div>
</template>

<template data-rute="kalibrasi-tensi">
<div class="page-head"><h2 class="title"><a class="back" href="tensi.html" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>Kalibrasi Tekanan Darah</h2></div><div id="kalibrasi"></div>
</template>

<template data-rute="perangkat">
<div class="page-head"><h2 class="title">Perangkat</h2></div><div id="perangkat"></div>
</template>

<template data-rute="profil">
<div class="page-head"><h2 class="title">Profil</h2></div>
<div class="card prof">
  <div class="prof-head"><div class="avatar lg" data-user="inisial">A</div><div><h3 data-user="nama">Pengguna</h3><small data-user="email">&mdash;</small></div></div>
  <form id="formProfil">
    <div class="form-grid">
      <label>Nama<input id="pNama" placeholder="Nama lengkap"></label>
      <label>Tanggal lahir<input id="pLahir" type="date"></label>
      <label>Jenis kelamin<select id="pJk"><option value="">—</option><option>Laki-laki</option><option>Perempuan</option></select></label>
      <label>Golongan darah<select id="pGol"><option value="">—</option><option>A</option><option>B</option><option>AB</option><option>O</option></select></label>
      <label>Tinggi (cm)<input id="pTinggi" type="number" min="50" max="250" step="0.1"></label>
      <label>Berat (kg)<input id="pBerat" type="number" min="2" max="400" step="0.1"></label>
    </div>
    <div class="galat-form hidden" id="galatProfil"></div>
    <p class="catatan" style="margin-bottom:.8rem">Semua isian opsional; hanya bentuknya yang diperiksa.</p>
    <button type="submit" class="btn-primary block">Simpan Profil</button>
  </form>
</div>
<div class="card prof">
  <ul class="list">
    <li data-ke="perangkat.html"><i class="ic green sm"><svg><use href="#i-watch"/></svg></i><div><b>Perangkat</b><small id="subPerangkat">&mdash;</small></div><svg class="chev"><use href="#i-chev"/></svg></li>
    <li data-ke="kalibrasi-tensi.html"><i class="ic blue sm"><svg><use href="#i-gauge"/></svg></i><div><b>Kalibrasi Tekanan Darah</b><small id="subKalibrasi">&mdash;</small></div><svg class="chev"><use href="#i-chev"/></svg></li>
    <li data-ke="pindai-kesehatan.html"><i class="ic violet sm"><svg><use href="#i-scan"/></svg></i><div><b>Pindai Kesehatan</b><small>Ukur di luar sesi makan</small></div><svg class="chev"><use href="#i-chev"/></svg></li>
    <li data-ke="bantuan.html"><i class="ic amber sm"><svg><use href="#i-headset"/></svg></i><div><b>Bantuan &amp; Dukungan</b></div><svg class="chev"><use href="#i-chev"/></svg></li>
  </ul>
  <button class="btn-ghost block danger" id="btnLogout" style="margin-top:1rem"><svg class="bi"><use href="#i-logout"/></svg> Keluar</button>
</div>
</template>

<template data-rute="bantuan">
<div class="page-head"><h2 class="title"><a class="back" href="profil.html" aria-label="Kembali"><svg><use href="#i-back"/></svg></a>Bantuan &amp; Dukungan</h2></div>

<div class="support">
  <div><b>Butuh Bantuan?</b><p>Kami siap membantu kapan pun kamu perlu.</p></div>
  <span><svg><use href="#i-headset"/></svg></span>
</div>

<div class="card">
  <div class="card-head"><h3>Cara Kerja Sesi Makan</h3></div>
  <ul class="kv">
    <li><span><b>1. Foto makanan.</b> Tekan tombol kamera di tengah. Saat rana ditekan, jam langsung mengukur <i>baseline</i> pra-makan dan tombol "Selesai Makan" di jam menyala. Angka gizinya dianalisis server; porsi yang meleset bisa dikoreksi selagi piring masih di depan mata.</span></li>
    <li><span><b>2. Selesai makan → tekan tombol di jam.</b> Momen itu menjadi titik nol (t0). Tombol "Saya Sudah Selesai Makan" di aplikasi melakukan hal yang sama: jam menekan tombolnya sendiri.</span></li>
    <li><span><b>3. +1 jam dan +2 jam.</b> Aplikasi menyalakan tombol ukur di jam saat jendelanya terbuka (55–70 menit dan 110–150 menit) dan mengukur otomatis bila tab masih terbuka. Terlalu cepat ditahan; terlalu lambat diterima dan ditandai <i>telat</i>.</span></li>
    <li><span><b>4. Ringkasan.</b> Puncak, kenaikan dari baseline, waktu pemulihan, dan kurva respons. Sesi yang titiknya terlewat disimpan sebagai <i>tidak lengkap</i>, bukan gagal — jam menyimpan sampel di buffer dan bisa mengirimnya belakangan.</span></li>
  </ul>
</div>
<div class="card">
  <div class="card-head"><h3>Menghubungkan Jam</h3></div>
  <ul class="kv">
    <li><span>Buka <b>Perangkat</b> → <b>Cari Jam AsaWatch</b>. Browser menampilkan pemilih; hanya jam AsaWatch yang dicari. Web Bluetooth tersedia di Chrome/Edge lewat HTTPS.</span></li>
    <li><span>Jam tidak punya jam dinding. Setiap kali tersambung, aplikasi mengirim jangkar waktu — jadi koneksi yang sering justru baik.</span></li>
    <li><span>Bila jam terputus, sesi tidak berhenti: sampel menunggu di buffer jam dan menyusul saat tersambung lagi.</span></li>
    <li><span>Di bawah baterai 10% jam menolak mengukur; isi daya dulu.</span></li>
  </ul>
</div>
<div class="card">
  <div class="card-head"><h3>Keterbatasan Versi Web</h3></div>
  <ul class="kv">
    <li><span>Tidak ada proses latar: pengingat dan pengukuran otomatis hanya berjalan selagi tab AsaWatch terbuka. Jadwal selalu dihitung ulang dari t0 saat halaman dibuka lagi.</span></li>
    <li><span>Data tersimpan di browser ini lebih dulu (IndexedDB) dan disinkronkan ke akun saat online. Masuk dengan akun lain membersihkan data lokal milik akun sebelumnya.</span></li>
  </ul>
</div>

<div class="card">
  <div class="card-head"><h3>Hubungi Kami</h3></div>
  <div class="contact">
    <a class="ct"><i class="ic green sm"><svg><use href="#i-info"/></svg></i><b>FAQ</b><small>Pertanyaan umum</small></a>
    <a class="ct" href="mailto:support@asawatch.id"><i class="ic blue sm"><svg><use href="#i-mail"/></svg></i><b>Email</b><small>support@asawatch.id</small></a>
    <a class="ct" href="https://wa.me/6281234567890"><i class="ic green sm"><svg><use href="#i-chat"/></svg></i><b>WhatsApp</b><small>0812-3456-7890</small></a>
  </div>
</div>
</template>
