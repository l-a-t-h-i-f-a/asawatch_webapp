<body data-page="profil">
<div id="page-content">
<div class="page-head"><h2 class="title">Profil</h2></div>
<div class="card prof">
  <div class="prof-head">
    <div class="avatar lg" data-user="inisial">A</div>
    <div><h3 data-user="nama">Pengguna</h3><small data-user="email">&mdash;</small></div>
    <button class="btn-ghost sm" id="btnEditProf"><svg class="bi"><use href="#i-edit"/></svg> Edit</button>
  </div>
  <ul class="list">
    <li><i class="ic green sm"><svg><use href="#i-user"/></svg></i>Informasi Pribadi<svg class="chev"><use href="#i-chev"/></svg></li>
    <li onclick="location.href='pengaturan-perangkat.html'"><i class="ic green sm"><svg><use href="#i-settings"/></svg></i>Pengaturan Perangkat<svg class="chev"><use href="#i-chev"/></svg></li>
    <li><i class="ic green sm"><svg><use href="#i-bell"/></svg></i>Pengingat Kesehatan<svg class="chev"><use href="#i-chev"/></svg></li>
    <li onclick="location.href='tujuan-kesehatan.html'"><i class="ic green sm"><svg><use href="#i-target"/></svg></i>Tujuan Kesehatan<svg class="chev"><use href="#i-chev"/></svg></li>
    <li onclick="location.href='bantuan.html'"><i class="ic green sm"><svg><use href="#i-headset"/></svg></i>Bantuan &amp; Dukungan<svg class="chev"><use href="#i-chev"/></svg></li>
    <li><i class="ic green sm"><svg><use href="#i-info"/></svg></i>Tentang Aplikasi<svg class="chev"><use href="#i-chev"/></svg></li>
  </ul>
  <button class="btn-ghost block danger" id="btnLogout"><svg class="bi"><use href="#i-logout"/></svg> Keluar</button>
</div>
</div>

<script src="js/pages.js"></script>
