<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2fa360">
<title>Profil · AsaWatch</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9200;</text></svg>">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body data-page="profil">
<div id="page-content">
<div class="page-head"><h2 class="title">Profil</h2></div>
<div class="card prof">
  <div class="prof-head"><div class="avatar lg" data-user="inisial">A</div><div><h3 data-user="nama">Pengguna</h3><small data-user="email">&mdash;</small></div></div>
  <form id="formProfil">
    <div class="form-grid">
      <label>Nama<input id="pNama" placeholder="Nama lengkap"></label>
      <label>Tanggal lahir<input id="pLahir" type="date"></label>
      <label>Jenis kelamin<select id="pJk"><option value="">—</option><option>Laki-laki</option><option>Perempuan</option></select></label>
      <label>Golongan darah<select id="pGol"><option value="">—</option><option>A</option><option>B</option><option>AB</option><option>O</option></select></label>
      <label>Tinggi (cm)<input id="pTinggi" type="number" min="50" max="250" step="0.1"></label>
      <label>Berat (kg)<input id="pBerat" type="number" min="2" max="400" step="0.1"></label>
    </div>
    <div class="galat-form hidden" id="galatProfil"></div>
    <p class="catatan" style="margin-bottom:.8rem">Semua isian opsional; hanya bentuknya yang diperiksa.</p>
    <button type="submit" class="btn-primary block">Simpan Profil</button>
  </form>
</div>
<div class="card prof">
  <ul class="list">
    <li onclick="location.href='perangkat.html'"><i class="ic green sm"><svg><use href="#i-watch"/></svg></i><div><b>Perangkat</b><small id="subPerangkat">&mdash;</small></div><svg class="chev"><use href="#i-chev"/></svg></li>
    <li onclick="location.href='kalibrasi-tensi.html'"><i class="ic blue sm"><svg><use href="#i-gauge"/></svg></i><div><b>Kalibrasi Tekanan Darah</b><small id="subKalibrasi">&mdash;</small></div><svg class="chev"><use href="#i-chev"/></svg></li>
    <li onclick="location.href='pindai-kesehatan.html'"><i class="ic violet sm"><svg><use href="#i-scan"/></svg></i><div><b>Pindai Kesehatan</b><small>Ukur di luar sesi makan</small></div><svg class="chev"><use href="#i-chev"/></svg></li>
    <li onclick="location.href='bantuan.html'"><i class="ic amber sm"><svg><use href="#i-headset"/></svg></i><div><b>Bantuan &amp; Dukungan</b></div><svg class="chev"><use href="#i-chev"/></svg></li>
  </ul>
  <button class="btn-ghost block danger" id="btnLogout" style="margin-top:1rem"><svg class="bi"><use href="#i-logout"/></svg> Keluar</button>
</div>
</div>
<script src="js/server-config.js"></script>
<script src="js/protokol.js"></script>
<script src="js/model.js"></script>
<script src="js/db.js"></script>
<script src="js/server.js"></script>
<script src="js/ble.js"></script>
<script src="js/sesi.js"></script>
<script src="js/komponen.js"></script>
<script src="js/kurva.js"></script>
<script src="js/shell.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
